[project]
name = "traffic-rl"
version = "0.1.0"
description = "Autonomous cybernetic multi-agent system for traffic signal control (Q-learning & DQN over Gymnasium)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Juan Santiago Ramos Ome" },
    { name = "Arlo Nicolás Ocampo Gallego" },
]

dependencies = [
    "gymnasium>=0.29",
    "numpy>=1.26",
    "torch>=2.2",
    "pyyaml>=6.0",
    "pygame>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# Apuntar setuptools a la carpeta src/
[tool.setuptools.packages.find]
where = ["src"]

# Apuntar pytest a la carpeta src/
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
exclude = [
    "docs",
    ".venv",
]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]